# Unencrypted shape only — docs/credentials.md §1. The real file is
# vault-encrypted (`ansible-vault encrypt secrets.vault.yml`) and
# .gitignore'd; this example is the only version checked in.
#
# M1 only needs libvirt_uri and ansible_ssh_private_key_path.
# domain_admin_password/hyperv_* are here so the file's shape matches
# later milestones (M2 Hyper-V, M4 domain controller) without needing
# a rework when those land.

# --- libvirt (M1) ---
libvirt_uri: qemu+ssh://labape@hyperv-host.lan/system   # docs/credentials.md §3

# The Ansible control machine's own SSH key, baked into every Linux
# VM's kickstart as the "labape" bootstrap user (docs/credentials.md
# §5). A matching "<path>.pub" file must exist alongside it —
# scripts/deploy.sh reads that to set TF_VAR_ssh_public_key.
ansible_ssh_private_key_path: ~/.ssh/labape_bootstrap

# --- Hyper-V (M2+, not used yet) ---
hyperv_host: hyperv01.lan
hyperv_user: Administrator
hyperv_password: "CHANGE_ME"

# --- Windows VM bootstrap ---
# Used by the libvirt backend's windows_server_2022 os_catalog entry
# (docs/base-images.md §4) — baked into every Windows VM's
# autounattend.xml as the local Administrator password, and as the
# WinRM connection password Ansible uses for its first connection.
windows_bootstrap_admin_password: "CHANGE_ME"

# --- AD domain (M4+, not used yet) ---
domain_admin_password: "CHANGE_ME"

# --- Software manifest local-file installers (M6+, not used yet) ---
# default_user_password: "CHANGE_ME"   # docs/directory-objects.md §6, if/when needed
