# Unencrypted shape only — Claude_Docs/Reference_Credentials.md §1. The real file is
# vault-encrypted (`ansible-vault encrypt secrets.vault.yml`) and
# .gitignore'd; this example is the only version checked in.
#
# M1 only needs libvirt_uri and ansible_ssh_private_key_path.
# domain_admin_password/hyperv_* are here so the file's shape matches
# later milestones (M2 Hyper-V, M4 domain controller) without needing
# a rework when those land.

# --- libvirt (M1) ---
libvirt_uri: qemu+ssh://labape@hyperv-host.lan/system   # Claude_Docs/Reference_Credentials.md §3

# The Ansible control machine's own SSH key, baked into every Linux
# VM's kickstart as the "labape" bootstrap user (Claude_Docs/Reference_Credentials.md
# §5). A matching "<path>.pub" file must exist alongside it —
# scripts/deploy.sh reads that to set TF_VAR_ssh_public_key.
ansible_ssh_private_key_path: ~/.ssh/labape_bootstrap

# --- Hyper-V (M2+, not used yet) ---
hyperv_host: hyperv01.lan
hyperv_user: Administrator
hyperv_password: "CHANGE_ME"

# --- Windows VM bootstrap ---
# Used by the libvirt backend's windows_server_2022 os_catalog entry
# (Claude_Docs/Design_Base-Images.md §4) — baked into every Windows VM's
# autounattend.xml as the local Administrator password, and as the
# WinRM connection password Ansible uses for its first connection.
windows_bootstrap_admin_password: "CHANGE_ME"

# --- AD domain (M4) ---
# Authenticates the *join* operations (windows_domain_join's
# microsoft.ad.membership, linux_domain_join's realm join) — NOT AD DS
# promotion itself, which runs as the connecting WinRM credential (the
# local Administrator, windows_bootstrap_admin_password above,
# Claude_Docs/Reference_Credentials.md §4).
#
# IMPORTANT until M5 lands dedicated domain-admin accounts
# (Claude_Docs/Design_Directory-Objects.md): promotion carries the existing local
# Administrator account — and its CURRENT password — into the new
# domain as Domain Administrator. So this value MUST equal
# windows_bootstrap_admin_password above, or every join fails on an
# authentication error.
domain_admin_password: "CHANGE_ME"

# safe_mode_password for AD DS promotion's DSRM account
# (ansible/roles/domain_controller).
dsrm_password: "CHANGE_ME"

# --- Directory objects (M5) ---
# Fallback password for any domain_users/local_users entry in
# directory-manifest.yml that omits password_vault_key — one password
# for every test user that doesn't need its own, Claude_Docs/Design_Directory-Objects.md
# §6. Only required if directory-manifest.yml actually has such an entry;
# harmless (never looked up) otherwise.
default_user_password: "CHANGE_ME"

# --- Software manifest local-file installers (M6+, not used yet) ---
