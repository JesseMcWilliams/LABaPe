# LABaPe's stack syslog collector (design §29.1). Static part; the listeners'
# TLS settings and the forwarding targets come from /etc/rsyslog-labape,
# which LABaPe writes (Admin → Settings → Syslog collector).

global(
  workDirectory="/var/spool/rsyslog"
  maxMessageSize="64k"
  parser.escapeControlCharactersOnReceive="on"
)

module(load="imudp")
module(load="imtcp" MaxSessions="2000")
module(load="ompgsql")
module(load="mmutf8fix")

# One row per message (labape.syslogstack.SCHEMA). option.stdsql doubles quotes.
template(name="labape_row" type="list" option.stdsql="on") {
  constant(value="INSERT INTO syslog_messages (received_at, reported_at, from_ip, host, facility, severity, app_name, procid, msgid, structured_data, message) VALUES ('")
  property(name="timegenerated" dateFormat="rfc3339")   constant(value="', '")
  property(name="timereported" dateFormat="rfc3339")    constant(value="', '")
  property(name="fromhost-ip")                          constant(value="', '")
  property(name="hostname" position.from="1" position.to="255")  constant(value="', ")
  property(name="syslogfacility")                       constant(value=", ")
  property(name="syslogseverity")                       constant(value=", '")
  property(name="app-name" position.from="1" position.to="128")  constant(value="', '")
  property(name="procid" position.from="1" position.to="128")    constant(value="', '")
  property(name="msgid" position.from="1" position.to="128")     constant(value="', '")
  property(name="structured-data")                      constant(value="', '")
  property(name="msg")                                  constant(value="')")
}

ruleset(name="labape") {
  action(type="mmutf8fix")                 # PostgreSQL rejects invalid UTF-8
  # Disk-assisted queue: a database restart doesn't lose messages.
  action(type="ompgsql" conninfo="postgresql:///syslog?host=/run/syslog-db&user=rsyslog_writer"
         template="labape_row"
         queue.type="LinkedList" queue.filename="pgsql" queue.maxDiskSpace="1g"
         queue.saveOnShutdown="on" action.resumeRetryCount="-1" action.resumeInterval="10")
  include(file="/etc/rsyslog-labape/forward.conf" mode="optional")
}

input(type="imudp" port="514" ruleset="labape")
input(type="imtcp" port="514" ruleset="labape")
# TLS 6514, written by the entrypoint once the certificates exist.
include(file="/run/labape-syslog/tls-input.conf" mode="optional")
