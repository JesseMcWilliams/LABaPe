# LABaPe container stack (Claude_Docs/Planning_Web-Interface-Design.md §14).
# Docker Compose v2 is the reference; `podman compose` runs the same file.
#
#   cd container
#   ./setup.sh                      # once: .env, generated secrets, config dirs
#   docker compose up -d --build
#
# See container/README.md for the configuration and secret files.

name: labape

x-labape: &labape
  image: ${LABAPE_IMAGE:-labape:local}
  build:
    context: ..
    dockerfile: container/Dockerfile
    args:
      # `git describe --tags` of the checkout; setup.sh and the installer set it.
      LABAPE_VERSION: ${LABAPE_VERSION:-dev}
  restart: unless-stopped
  # An init process reaps the orphaned grandchildren a cancelled job's
  # tools leave behind (the worker would otherwise be PID 1).
  init: true
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    LABAPE_PUBLIC_URL: https://${LABAPE_HOSTNAME:?set LABAPE_HOSTNAME in container/.env}
    LABAPE_DATABASE_URL_FILE: /run/secrets/database_url
    LABAPE_TOFU_PG_CONN_FILE: /run/secrets/tofu_pg_conn
    LABAPE_SECRET_KEY_FILE: /run/secrets/secret_key
    LABAPE_OIDC_ISSUER: ${LABAPE_OIDC_ISSUER:-}
    LABAPE_OIDC_CLIENT_ID: ${LABAPE_OIDC_CLIENT_ID:-}
    LABAPE_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    LABAPE_OIDC_DISPLAY_NAME: ${LABAPE_OIDC_DISPLAY_NAME:-Authentik}
    LABAPE_MAX_KVM_HOSTS: ${LABAPE_MAX_KVM_HOSTS:-4}
    # Platform CA (design §22.5): where the API reaches it, and where VMs renew.
    LABAPE_CA_URL: https://labape-ca:9000
    LABAPE_CA_PUBLIC_URL: https://${LABAPE_HOSTNAME}:${LABAPE_CA_PORT:-9444}
    LABAPE_CA_ROOT: /var/lib/labape-ca/certs/root_ca.crt
    LABAPE_CA_PASSWORD_FILE: /run/secrets/ca_password
  secrets: [database_url, tofu_pg_conn, secret_key, oidc_client_secret, ca_password]
  volumes:
    - labape-data:/var/lib/labape
    - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
    - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labape
      POSTGRES_DB: labape
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labape -d labape"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The platform CA (design §22.5): step-ca, initialized on first start by ca/init.sh.
  labape-ca:
    image: docker.io/smallstep/step-ca:0.30.2
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/labape/init.sh"]
    command: []
    environment:
      LABAPE_CA_NAME: ${LABAPE_CA_NAME:-LABaPe CA}
      LABAPE_CA_DNS: labape-ca,localhost,${LABAPE_HOSTNAME}
    secrets: [ca_password]
    ports:
      # VMs renew their certificates here (mTLS); the API and Caddy use labape-ca:9000.
      - "${LABAPE_CA_PORT:-9444}:9000"
    volumes:
      - labape-ca:/home/step
      - ./ca:/labape:ro          # init.sh, and repass.sh for the agent's password rotation
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 30

  labape-api:
    <<: *labape
    command: ["labape", "serve", "--port", "8000"]
    # The file manager writes uploads into the data root (design §9).
    volumes:
      - labape-data:/var/lib/labape
      - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
      - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro
      - ${LABAPE_DATA_ROOT:-/data}:${LABAPE_DATA_ROOT:-/data}
      - labape-ca:/var/lib/labape-ca:ro
      # Requests to, and status from, the host's update agent (design §23.2).
      - ./update:/var/lib/labape-update

  labape-worker:
    <<: *labape
    command: ["labape", "worker"]
    # The local KVM host: libvirt's socket, the storage tree at the same
    # path as on the host (libvirt resolves disk and ISO paths on the host),
    # and /dev/kvm for Packer builds (phase 10b).
    volumes:
      - labape-data:/var/lib/labape
      - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
      - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro
      - /var/run/libvirt:/var/run/libvirt
      - ${LABAPE_DATA_ROOT:-/data}:${LABAPE_DATA_ROOT:-/data}
      - labape-ca:/var/lib/labape-ca:ro
      - ./update:/var/lib/labape-update
    devices:
      - /dev/kvm:/dev/kvm
    cap_add: [NET_RAW]

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on: [labape-api]
    environment:
      LABAPE_HOSTNAME: ${LABAPE_HOSTNAME}
      LABAPE_TLS: ${LABAPE_TLS:-internal}
    ports:
      - "${LABAPE_HTTPS_PORT:-443}:443"
      - "${LABAPE_HTTP_PORT:-80}:80"
      # Break-glass host-only listener: bound to the host's loopback only.
      - "127.0.0.1:8443:8443"
    volumes:
      # LABAPE_CADDYFILE=Caddyfile.labape-ca: the web interface's certificate from the platform CA.
      - ./caddy/${LABAPE_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - labape-ca:/labape-ca:ro
      - caddy-data:/data
      - caddy-config:/config

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  tofu_pg_conn:
    file: ./secrets/tofu_pg_conn
  secret_key:
    file: ./secrets/secret_key
  oidc_client_secret:
    file: ./secrets/oidc_client_secret
  ca_password:
    file: ./secrets/ca_password

volumes:
  postgres-data:
  labape-data:
  labape-ca:
  caddy-data:
  caddy-config:
