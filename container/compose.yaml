# LABaPe container stack (Claude_Docs/Planning_Web-Interface-Design.md §14).
# Docker Compose v2 is the reference; `podman compose` runs the same file.
#
#   cd container
#   ./setup.sh                      # once: .env, generated secrets, config dirs
#   docker compose up -d --build
#
# See container/README.md for the configuration and secret files.

name: labape

x-labape: &labape
  image: ${LABAPE_IMAGE:-labape:local}
  build:
    context: ..
    dockerfile: container/Dockerfile
    args:
      # `git describe --tags` of the checkout; setup.sh and the installer set it.
      LABAPE_VERSION: ${LABAPE_VERSION:-dev}
  restart: unless-stopped
  # An init process reaps the orphaned grandchildren a cancelled job's
  # tools leave behind (the worker would otherwise be PID 1).
  init: true
  depends_on:
    postgres:
      condition: service_healthy
  environment:
    LABAPE_PUBLIC_URL: https://${LABAPE_HOSTNAME:?set LABAPE_HOSTNAME in container/.env}
    LABAPE_DATABASE_URL_FILE: /run/secrets/database_url
    LABAPE_TOFU_PG_CONN_FILE: /run/secrets/tofu_pg_conn
    LABAPE_SECRET_KEY_FILE: /run/secrets/secret_key
    LABAPE_OIDC_ISSUER: ${LABAPE_OIDC_ISSUER:-}
    LABAPE_OIDC_CLIENT_ID: ${LABAPE_OIDC_CLIENT_ID:-}
    LABAPE_OIDC_CLIENT_SECRET_FILE: /run/secrets/oidc_client_secret
    LABAPE_OIDC_DISPLAY_NAME: ${LABAPE_OIDC_DISPLAY_NAME:-Authentik}
    LABAPE_MAX_KVM_HOSTS: ${LABAPE_MAX_KVM_HOSTS:-4}
    # Platform CA (design §22.5): where the API reaches it, and where VMs renew.
    LABAPE_CA_URL: https://labape-ca:9000
    LABAPE_CA_PUBLIC_URL: https://${LABAPE_HOSTNAME}:${LABAPE_CA_PORT:-9444}
    LABAPE_CA_ROOT: /var/lib/labape-ca/certs/root_ca.crt
    LABAPE_CA_PASSWORD_FILE: /run/secrets/ca_password
  secrets: [database_url, tofu_pg_conn, secret_key, oidc_client_secret, ca_password]
  volumes:
    - labape-data:/var/lib/labape
    - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
    - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro

services:
  postgres:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: labape
      POSTGRES_DB: labape
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labape -d labape"]
      interval: 5s
      timeout: 5s
      retries: 20

  # The platform CA (design §22.5): step-ca, initialized on first start by ca/init.sh.
  labape-ca:
    image: docker.io/smallstep/step-ca:0.30.2
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/labape/init.sh"]
    command: []
    environment:
      LABAPE_CA_NAME: ${LABAPE_CA_NAME:-LABaPe CA}
      LABAPE_CA_DNS: labape-ca,localhost,${LABAPE_HOSTNAME}
    secrets: [ca_password]
    ports:
      # VMs renew their certificates here (mTLS); the API and Caddy use labape-ca:9000.
      - "${LABAPE_CA_PORT:-9444}:9000"
    volumes:
      - labape-ca:/home/step
      - ./ca:/labape:ro          # init.sh, and repass.sh for the agent's password rotation
    healthcheck:
      test: ["CMD", "step", "ca", "health", "--ca-url", "https://localhost:9000", "--root", "/home/step/certs/root_ca.crt"]
      interval: 10s
      timeout: 5s
      retries: 30

  labape-api:
    <<: *labape
    command: ["labape", "serve", "--port", "8000"]
    # The file manager writes uploads into the data root (design §9).
    volumes:
      - labape-data:/var/lib/labape
      - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
      - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro
      - ${LABAPE_DATA_ROOT:-/data}:${LABAPE_DATA_ROOT:-/data}
      - labape-ca:/var/lib/labape-ca:ro
      # Requests to, and status from, the host's update agent (design §23.2).
      - ./update:/var/lib/labape-update
      # Remote session recordings that guacd writes (design §28.5), for auditors.
      - labape-recordings:/var/lib/labape-recordings:ro
      # The stack syslog collector (design §29.1): its database socket, the settings
      # LABaPe renders for it, and its certificates (the worker issues them).
      - labape-syslog-run:/run/syslog-db
      - labape-syslog-conf:/var/lib/labape-syslog/conf
      - labape-syslog-tls:/var/lib/labape-syslog/tls

  # Browser SSH/RDP/VNC (design §28.5, question 116): guacd behind the API's own
  # tunnel. Never published: only the API talks to it, with the credentials it
  # fills in server-side. Recordings go to its home folder (a volume it owns).
  labape-guacd:
    image: docker.io/guacamole/guacd:1.6.0
    restart: unless-stopped
    volumes:
      - labape-recordings:/home/guacd

  # Syslog collector (design §29.1, questions 121-139): rsyslog on UDP/TCP 514 and
  # TLS 6514, published on the host, writing to its own PostgreSQL over a socket.
  labape-syslog-db:
    image: docker.io/library/postgres:17-alpine
    restart: unless-stopped
    command: ["postgres", "-c", "listen_addresses="]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes:
      - labape-syslog-db:/var/lib/postgresql/data
      - labape-syslog-run:/var/run/postgresql
      - ./syslog/db-init.sh:/docker-entrypoint-initdb.d/10-labape-syslog.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h /var/run/postgresql -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  labape-syslog:
    image: ${LABAPE_SYSLOG_IMAGE:-labape-syslog:local}
    build:
      context: ..
      dockerfile: container/syslog/Dockerfile
    restart: unless-stopped
    depends_on:
      labape-syslog-db:
        condition: service_healthy
    ports:
      - "${LABAPE_SYSLOG_BIND:-0.0.0.0}:514:514/udp"
      - "${LABAPE_SYSLOG_BIND:-0.0.0.0}:514:514/tcp"
      - "${LABAPE_SYSLOG_BIND:-0.0.0.0}:6514:6514/tcp"
    volumes:
      - labape-syslog-run:/run/syslog-db
      - labape-syslog-conf:/etc/rsyslog-labape:ro
      - labape-syslog-tls:/tls:ro
      - labape-syslog-spool:/var/spool/rsyslog

  labape-worker:
    <<: *labape
    command: ["labape", "worker"]
    # The local KVM host: libvirt's socket, the storage tree at the same
    # path as on the host (libvirt resolves disk and ISO paths on the host),
    # and /dev/kvm for Packer builds (phase 10b).
    volumes:
      - labape-data:/var/lib/labape
      - ${LABAPE_CONFIG_PATH:-./config}:/etc/labape:ro
      - ${LABAPE_ENGINE_SECRETS_PATH:-./engine-secrets}:/run/labape-secrets:ro
      - /var/run/libvirt:/var/run/libvirt
      - ${LABAPE_DATA_ROOT:-/data}:${LABAPE_DATA_ROOT:-/data}
      - labape-ca:/var/lib/labape-ca:ro
      - ./update:/var/lib/labape-update
      # Deletes recordings past Settings → Remote access's retention.
      - labape-recordings:/var/lib/labape-recordings
      # The stack syslog collector (design §29.1): its database socket, the settings
      # LABaPe renders for it, and its certificates (the worker issues them).
      - labape-syslog-run:/run/syslog-db
      - labape-syslog-conf:/var/lib/labape-syslog/conf
      - labape-syslog-tls:/var/lib/labape-syslog/tls
    devices:
      - /dev/kvm:/dev/kvm
    cap_add: [NET_RAW]

  caddy:
    image: docker.io/library/caddy:2
    restart: unless-stopped
    depends_on: [labape-api]
    environment:
      LABAPE_HOSTNAME: ${LABAPE_HOSTNAME}
      LABAPE_TLS: ${LABAPE_TLS:-internal}
      # Authentik on this host (tools/authentik-test), served on 9445 with the web interface's
      # certificate (design §47); the browser and linked stacks sign in there.
      LABAPE_AUTHENTIK_UPSTREAM: ${LABAPE_AUTHENTIK_UPSTREAM:-host.docker.internal:9000}
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports:
      - "${LABAPE_HTTPS_PORT:-443}:443"
      - "${LABAPE_HTTP_PORT:-80}:80"
      - "${LABAPE_AUTH_PORT:-9445}:9445"
      # Break-glass host-only listener: bound to the host's loopback only.
      - "127.0.0.1:8443:8443"
    volumes:
      # LABAPE_CADDYFILE=Caddyfile.labape-ca: the web interface's certificate from the platform CA.
      - ./caddy/${LABAPE_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      # Caddyfile.names: the certificate with every name of the stack (caddy/web-tls.sh, design §48.4).
      - ./caddy/tls:/labape-tls:ro
      - labape-ca:/labape-ca:ro
      - caddy-data:/data
      - caddy-config:/config

  # --- The secret stores (design §26): OpenBao and Conjur Open Source -------------
  # In the `stores` profile, which stores/stores.sh turns on (COMPOSE_PROFILES in
  # .env) once their secret files and certificates exist. Published on the
  # host's loopback by default, for the update agent and the command line;
  # LABAPE_STORES_BIND opens them to other hosts. Files are mounted one by one:
  # a missing source would otherwise become an empty directory.
  labape-openbao:
    image: docker.io/openbao/openbao:2.7.1
    profiles: [stores]
    command: server
    # always: it exits 0 when the host shuts down, and unless-stopped then left it down.
    restart: always
    cap_add: [IPC_LOCK]
    environment:
      BAO_ADDR: https://127.0.0.1:8200
      BAO_CACERT: /openbao/tls/root.crt
      BAO_TLS_SERVER_NAME: labape-openbao
    volumes:
      - ./stores/openbao/config.hcl:/openbao/config/config.hcl:ro
      - ./stores/tls:/openbao/tls:ro
      - labape-openbao:/openbao/file
    ports:
      - "${LABAPE_STORES_BIND:-127.0.0.1}:${LABAPE_OPENBAO_PORT:-8200}:8200"

  labape-conjur-db:
    image: docker.io/library/postgres:17-alpine
    profiles: [stores]
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD_FILE: /run/stores/conjur_db_password
    volumes:
      - ./stores/secrets/conjur_db_password:/run/stores/conjur_db_password:ro
      - labape-conjur-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  labape-conjur:
    image: docker.io/cyberark/conjur:1.27.0
    profiles: [stores]
    restart: unless-stopped
    depends_on:
      labape-conjur-db:
        condition: service_healthy
    # Conjur takes its data key and database URL only from the environment (stores/conjur/env.sh).
    entrypoint: ["/bin/sh", "-c", ". /run/stores/env.sh && exec conjurctl server"]
    environment:
      CONJUR_AUTHENTICATORS: authn
    volumes:
      - ./stores/secrets/conjur_data_key:/run/stores/conjur_data_key:ro
      - ./stores/secrets/conjur_db_password:/run/stores/conjur_db_password:ro
      - ./stores/conjur/policy.yml:/policy/labape.yml:ro
      - ./stores/conjur/env.sh:/run/stores/env.sh:ro

  labape-conjur-tls:
    image: docker.io/library/nginx:1.28-alpine
    profiles: [stores]
    restart: unless-stopped
    depends_on: [labape-conjur]
    volumes:
      - ./stores/conjur/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./stores/tls:/etc/nginx/tls:ro
    ports:
      - "${LABAPE_STORES_BIND:-127.0.0.1}:${LABAPE_CONJUR_PORT:-8444}:8443"

# The bootstrap secrets (design §26, S4): container/secrets/ until stores/stores.sh
# moves them into OpenBao; then LABAPE_SECRETS_DIR names a memory-only folder the
# update agent fills from the store before it starts the stack.
secrets:
  postgres_password:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/postgres_password
  database_url:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/database_url
  tofu_pg_conn:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/tofu_pg_conn
  secret_key:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/secret_key
  oidc_client_secret:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/oidc_client_secret
  ca_password:
    file: ${LABAPE_SECRETS_DIR:-./secrets}/ca_password

volumes:
  labape-recordings:
  labape-syslog-db:
  labape-syslog-run:
  labape-syslog-conf:
  labape-syslog-tls:
  labape-syslog-spool:
  postgres-data:
  labape-data:
  labape-ca:
  caddy-data:
  caddy-config:
  labape-openbao:
  labape-conjur-db:
