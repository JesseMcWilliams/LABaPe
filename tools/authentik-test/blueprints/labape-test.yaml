# LABaPe test setup for a throwaway Authentik (tools/authentik-test/README.md):
# the LABaPe OIDC application, the role groups LABaPe maps by default
# (LABAPE_ROLE_MAP), three local users and a read-only directory account. Secrets come from the
# environment (tools/authentik-test/.env, generated by deploy.sh).
version: 1
metadata:
  name: LABaPe test
  labels:
    blueprints.goauthentik.io/instantiate: "true"
entries:
  - model: authentik_core.group
    id: grp-admins
    identifiers: {name: labape-admins}
    attrs: {name: labape-admins}
  - model: authentik_core.group
    id: grp-template-editors
    identifiers: {name: labape-template-editors}
    attrs: {name: labape-template-editors}
  - model: authentik_core.group
    id: grp-deployers
    identifiers: {name: labape-deployers}
    attrs: {name: labape-deployers}
  - model: authentik_core.group
    id: grp-file-managers
    identifiers: {name: labape-file-managers}
    attrs: {name: labape-file-managers}
  - model: authentik_core.group
    id: grp-viewers
    identifiers: {name: labape-viewers}
    attrs: {name: labape-viewers}

  - model: authentik_core.user
    identifiers: {username: labape-admin}
    attrs:
      name: LABaPe test admin
      email: labape-admin@example.invalid
      password: !Env [LABAPE_TEST_USER_PASSWORD, ""]
      groups: [!KeyOf grp-admins]
  - model: authentik_core.user
    identifiers: {username: labape-dev}
    attrs:
      name: LABaPe test developer
      email: labape-dev@example.invalid
      password: !Env [LABAPE_TEST_USER_PASSWORD, ""]
      groups: [!KeyOf grp-deployers]
  - model: authentik_core.user
    identifiers: {username: labape-viewer}
    attrs:
      name: LABaPe test viewer
      email: labape-viewer@example.invalid
      password: !Env [LABAPE_TEST_USER_PASSWORD, ""]
      groups: [!KeyOf grp-viewers]

  # Read-only directory lookup for LABaPe's group search (design §21.6):
  # a service account whose only permission is viewing groups, and its
  # non-expiring API token (LABAPE_TEST_DIRECTORY_TOKEN in .env).
  - model: authentik_rbac.role
    id: role-directory
    identifiers: {name: labape-directory-reader}
    attrs:
      name: labape-directory-reader
      permissions: [authentik_core.view_group]
  - model: authentik_core.user
    id: user-directory
    identifiers: {username: labape-directory}
    attrs:
      name: LABaPe directory lookup
      type: service_account
      roles: [!KeyOf role-directory]
  # state: created: made once, never reset, so LABaPe's rotation of its key sticks.
  - model: authentik_core.token
    state: created
    identifiers: {identifier: labape-directory}
    attrs:
      intent: api
      user: !KeyOf user-directory
      expiring: false
      description: LABaPe group search (read-only)
      key: !Env [LABAPE_TEST_DIRECTORY_TOKEN, ""]

  - model: authentik_providers_oauth2.oauth2provider
    id: provider
    identifiers: {name: labape}
    attrs:
      authorization_flow: !Find [authentik_flows.flow, [slug, default-provider-authorization-implicit-consent]]
      invalidation_flow: !Find [authentik_flows.flow, [slug, default-provider-invalidation-flow]]
      client_type: confidential
      # Recent Authentik releases default this to an empty list for
      # blueprint-created providers, which refuses every grant
      # ("Invalid grant_type for provider").
      grant_types: [authorization_code, refresh_token]
      client_id: labape
      client_secret: !Env [LABAPE_TEST_CLIENT_SECRET, ""]
      redirect_uris:
        - matching_mode: strict
          url: !Format ["https://%s/api/auth/oidc/callback", !Env [LABAPE_HOSTNAME, labape.local]]
      signing_key: !Find [authentik_crypto.certificatekeypair, [name, authentik Self-signed Certificate]]
      sub_mode: hashed_user_id
      include_claims_in_id_token: true
      property_mappings:
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-openid]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-email]]
        - !Find [authentik_providers_oauth2.scopemapping, [managed, goauthentik.io/providers/oauth2/scope-profile]]

  - model: authentik_core.application
    identifiers: {slug: labape}
    attrs:
      name: LABaPe
      provider: !KeyOf provider

  # Elevated account for secret rotation (design §24): LABaPe uses it to set
  # a new key on the read-only directory token, which can't change itself.
  # Authentik checks token permissions on the token object, so deploy.sh
  # grants view_token and set_token_key on the directory token only (the
  # blueprint importer can't assign object permissions to a role).
  - model: authentik_rbac.role
    id: role-rotator
    identifiers: {name: labape-token-rotator}
    attrs:
      name: labape-token-rotator
      permissions: [authentik_core.view_token]
  - model: authentik_core.user
    id: user-rotator
    identifiers: {username: labape-rotator}
    attrs:
      name: LABaPe secret rotation
      type: service_account
      roles: [!KeyOf role-rotator]
  - model: authentik_core.token
    state: created
    identifiers: {identifier: labape-rotator}
    attrs:
      intent: api
      user: !KeyOf user-rotator
      expiring: false
      description: LABaPe secret rotation (sets the directory token's key)
      key: !Env [LABAPE_TEST_ROTATOR_TOKEN, ""]
