# Throwaway Authentik for testing LABaPe sign-in (tools/authentik-test/README.md).
# Based on Authentik's published compose file; not for production use.
name: authentik-test

x-authentik: &authentik
  image: ghcr.io/goauthentik/server:${AUTHENTIK_TAG:-2026.8.3}
  restart: unless-stopped
  env_file: .env
  environment:
    AUTHENTIK_POSTGRESQL__HOST: postgresql
    AUTHENTIK_POSTGRESQL__USER: authentik
    AUTHENTIK_POSTGRESQL__NAME: authentik
    AUTHENTIK_POSTGRESQL__PASSWORD: ${PG_PASS:?run deploy.sh}
  depends_on:
    postgresql:
      condition: service_healthy

services:
  postgresql:
    image: docker.io/library/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${PG_PASS:?run deploy.sh}
      POSTGRES_USER: authentik
      POSTGRES_DB: authentik
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d authentik -U authentik"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    <<: *authentik
    command: server
    ports:
      - "${AUTHENTIK_HTTP_PORT:-9000}:9000"
      - "${AUTHENTIK_HTTPS_PORT:-9443}:9443"
    volumes:
      - ./blueprints:/blueprints/custom:ro

  worker:
    <<: *authentik
    command: worker
    volumes:
      - ./blueprints:/blueprints/custom:ro

volumes:
  database:
