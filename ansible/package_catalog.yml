# Repo-committed, stable — docs/software-manifest.md §1. Generic name
# -> per-package-manager spelling. Extend freely; nothing here is
# specific to one environment or run.
#
# The custom-installer entries below (internal_agent, vendor_tool,
# legacy_exe_tool) are illustrative only — their url/path values are
# placeholders. Real entries of that shape need a real URL or a real
# file staged in software-store/ (docs/software-manifest.md §8).

packages:
  firefox:
    chocolatey: firefox
    apt: firefox
    dnf: firefox
    zypper: MozillaFirefox        # deliberately not the same string everywhere

  vscode:
    chocolatey: vscode
    apt:
      package: code
      repo: microsoft             # needs Microsoft's repo added first, §3
    dnf:
      package: code
      repo: microsoft
    # no zypper entry — silently skipped on openSUSE/SLES hosts, §2

  sevenzip:
    chocolatey: 7zip
    apt: p7zip-full
    dnf: p7zip
    zypper: 7zip

  notepadplusplus:
    chocolatey: notepadplusplus
    # windows-only tool — no linux fields at all, same silent-skip rule

  # --- Illustrative only, not usable as shipped (§8/§9) ---

  internal_agent:
    windows:
      type: msi
      source: url
      url: https://internal.example.com/agent.msi
      product_id: "{B1234567-0000-0000-0000-000000000000}"
    linux:
      type: deb
      source: url
      url: https://internal.example.com/agent.deb

  vendor_tool:
    windows:
      type: msi
      source: local
      path: vendor_tool/vendor-tool-4.1.msi
      product_id: "{C7654321-0000-0000-0000-000000000000}"
    linux:
      type: rpm
      source: local
      path: vendor_tool/vendor-tool-4.1.rpm
