[defaults]
inventory = ./inventory/generated
roles_path = ./roles
# Explicit, matching roles_path above — Ansible's default filter-plugin
# discovery looks next to the playbook file (playbooks/filter_plugins),
# not the ansible/ directory these actually live in (confirmed hands-on:
# M5's ou_dns/for_host_group filters, ansible/filter_plugins/
# directory_objects.py, went undiscovered without this).
filter_plugins = ./filter_plugins
# Disposable, rebuilt-from-scratch lab hosts reuse IPs across runs
# (DESIGN.md §8/§14) — a fresh host key every rebuild would otherwise
# fail known_hosts checks on every single deploy.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = False
