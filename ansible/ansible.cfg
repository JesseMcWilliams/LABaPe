[defaults]
inventory = ./inventory/generated
roles_path = ./roles
# Disposable, rebuilt-from-scratch lab hosts reuse IPs across runs
# (DESIGN.md §8/§14) — a fresh host key every rebuild would otherwise
# fail known_hosts checks on every single deploy.
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent

[privilege_escalation]
become = False
