---
# AD DS promotion — Claude_Docs/Design_System-Overview.md §8/§18 (M4). Creates a brand-new forest
# every time (Claude_Docs/Design_System-Overview.md §8: "each rebuild creates a brand-new AD
# forest — no state carried over"), never joins an existing one.

- name: Install the AD-Domain-Services Windows feature
  ansible.windows.win_feature:
    name: AD-Domain-Services
    state: present
    include_management_tools: true

# microsoft.ad.domain promotes the CONNECTING account (the local
# Administrator this play is already authenticated as, per
# Claude_Docs/Reference_Credentials.md §4) into the new forest as Domain Administrator —
# its password doesn't change. domain_admin_password (used by the join
# roles, not this task) must match windows_bootstrap_admin_password
# until M5 adds dedicated domain-admin accounts — see
# secrets.vault.example.yml.
- name: Promote this host to a new AD DS forest
  microsoft.ad.domain:
    dns_domain_name: "{{ domain_name }}"
    domain_netbios_name: "{{ netbios_name }}"
    safe_mode_password: "{{ dsrm_password }}"
    reboot: true
    reboot_timeout: 1800
  register: promote_result

# Informational, not a hard gate — AD/DNS/SYSVOL can take a few seconds
# to fully settle right after the reboot, and a flaky failure here
# would be worse than just surfacing whatever dcdiag says.
- name: Sanity-check the new domain controller (informational only)
  ansible.windows.win_command: dcdiag /q
  register: dcdiag_result
  failed_when: false
  changed_when: false

- name: Show dcdiag output
  ansible.builtin.debug:
    var: dcdiag_result.stdout_lines

# A1 (Planning_Lists-Secrets-Settings.md): a second domain admin, only for recovery: LABaPe sets the
# domain Administrator's password again with it when that one is lost, and the other way round. Its
# password is LABaPe's (labape_recovery_domain_password, per environment); a deploy sets it again.
- name: Second domain admin for recovery (labape-admin2)
  microsoft.ad.user:
    name: "{{ labape_recovery_admin | default('labape-admin2') }}"
    password: "{{ labape_recovery_domain_password }}"
    update_password: always
    password_never_expires: true
    enabled: true
    description: LABaPe recovery account (resets the domain Administrator; see the Secrets page)
    groups:
      add: [Domain Admins]
    state: present
  run_once: true
  no_log: true
  when: labape_recovery_domain_password | default('') | length > 0

