---
# Rocky 9's kickstart sets a plain --nameserver (the LAN gateway), and
# /etc/resolv.conf is NetworkManager-managed by default — a direct edit
# would likely get silently clobbered, so this goes through nmcli
# instead, editing only the DNS fields of the existing connection
# profile rather than redescribing the whole profile (which risks
# clobbering the existing static/DHCP config).
- name: Find the active NetworkManager connection profile
  ansible.builtin.command: >-
    nmcli -g GENERAL.CONNECTION device show {{ ansible_facts.default_ipv4.interface }}
  register: nm_conn
  changed_when: false

- name: Check the connection profile's current DNS servers
  ansible.builtin.command: >-
    nmcli -g ipv4.dns connection show "{{ nm_conn.stdout }}"
  register: nm_current_dns
  changed_when: false

# ignore-auto-dns: a DHCP lease's DNS servers are dropped, not added.
- name: Point this host's DNS resolver at the domain controllers
  ansible.builtin.command: >-
    nmcli connection modify "{{ nm_conn.stdout }}"
    ipv4.dns "{{ domain_controller_ips | join(',') }}" ipv4.ignore-auto-dns yes
  when: nm_current_dns.stdout != (domain_controller_ips | join(','))
  register: nm_dns_changed

# device reapply applies the pending config without tearing the link
# down — gentler than `connection up`, which can briefly drop the
# interface this very SSH session is riding on.
- name: Apply the DNS change
  ansible.builtin.command: >-
    nmcli device reapply {{ ansible_facts.default_ipv4.interface }}
  when: nm_dns_changed is changed

- name: Reconnect after the DNS change (defensive)
  ansible.builtin.wait_for_connection:
    timeout: 60
  when: nm_dns_changed is changed

# On template clones cloud-init runs NetworkManager with `dns = none`, so
# NetworkManager never writes /etc/resolv.conf and the connection's DNS
# above doesn't reach it (a clone kept its template's resolvers and
# `realm discover` found no SRV records). Neither NetworkManager nor DHCP
# touches the file in that mode, so it's written directly.
- name: Read /etc/resolv.conf
  ansible.builtin.slurp:
    path: /etc/resolv.conf
  register: nm_resolv

- name: Point /etc/resolv.conf at the domain controllers (NetworkManager with dns=none)
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    content: |
      # Managed by LABaPe (ansible/roles/linux_domain_join): NetworkManager
      # runs with dns=none here, so this file is static.
      search {{ domain_name }}
      {% for ip in domain_controller_ips %}
      nameserver {{ ip }}
      {% endfor %}
    mode: "0644"
  when: >-
    (nm_resolv.content | b64decode | regex_findall('(?m)^nameserver\s+(\S+)'))
    != domain_controller_ips
