---
# Windows counterpart to linux_common/tasks/main.yml — same union/
# normalize/install shape (Claude_Docs/Design_Software-Manifest.md §5), simplified
# since there's only one package manager to branch on. win_chocolatey
# bootstraps Chocolatey itself on first use, so there's no separate
# "install Chocolatey" step needed here.

# Every KVM guest runs qemu-guest-agent (Claude_Docs/Planning_Web-Interface-Design.md
# §22.1). On Windows it comes with the virtio-win guest tools, which also
# install the virtio-serial driver the agent channel needs. Downloaded once,
# checked against a pinned SHA-256, skipped when the QEMU-GA service exists.
- name: Download the virtio-win guest tools on KVM guests
  ansible.windows.win_get_url:
    url: "{{ virtio_win_guest_tools_url }}"
    dest: 'C:\Windows\Temp\virtio-win-guest-tools.exe'
    checksum: "{{ virtio_win_guest_tools_sha256 }}"
    checksum_algorithm: sha256
  when: ansible_system_vendor | default('') == 'QEMU'

- name: Install the virtio-win guest tools (qemu-guest-agent)
  ansible.windows.win_package:
    path: 'C:\Windows\Temp\virtio-win-guest-tools.exe'
    arguments: /install /quiet /norestart
    creates_service: QEMU-GA
    expected_return_code: [0, 3010]
  when: ansible_system_vendor | default('') == 'QEMU'

# The environment's time zone (design §52). VMs get a UTC hardware clock, so Windows is told to read
# it as UTC, then given the zone; the clock is corrected from the controller if the install left it
# off (an install under another clock setting can). Environments from before the option have no
# labape_timezone and are left alone.
- name: Tell Windows the hardware clock is UTC
  ansible.windows.win_regedit:
    path: HKLM:\SYSTEM\CurrentControlSet\Control\TimeZoneInformation
    name: RealTimeIsUniversal
    data: 1
    type: dword
  when: labape_timezone is defined and ansible_system_vendor | default('') == 'QEMU'

- name: Set the environment's time zone
  ansible.windows.win_timezone:
    timezone: "{{ labape_windows_timezone }}"
  when: labape_timezone is defined

- name: Correct the clock when it is more than two minutes off
  ansible.windows.win_shell: |
    $want = [DateTimeOffset]::FromUnixTimeSeconds({{ lookup('pipe', 'date -u +%s') }})
    if ([Math]::Abs(($want - [DateTimeOffset]::UtcNow).TotalSeconds) -gt 120) {
      Set-Date -Date $want.LocalDateTime | Out-Null
      'clock set'
    }
  register: windows_common_clock
  changed_when: "'clock set' in windows_common_clock.stdout"
  when: labape_timezone is defined and ansible_system_vendor | default('') == 'QEMU'

- name: Union this host's role package lists (raw catalog keys / inline overrides)
  ansible.builtin.set_fact:
    windows_common_raw_packages: "{{ (windows_common_raw_packages | default([])) + (software_manifest_roles[item] | default([])) }}"
  loop: "{{ group_names }}"
  loop_control:
    label: "{{ item }}"

# Applications chosen for this host's group in the web UI (design §21.4),
# written by the job runner to inventory host_vars; the CLI never sets it.
- name: Add the applications chosen in the web UI
  ansible.builtin.set_fact:
    windows_common_raw_packages: "{{ (windows_common_raw_packages | default([])) + (labape_extra_packages | default([])) }}"
  when: labape_extra_packages | default([]) | length > 0

# A host with no packages assigned at all (raw_packages ends up [])
# means the loop below has zero iterations — set_fact never runs, so
# without this the variable it would have created is simply undefined
# rather than an empty list, and the next task fails referencing it.
- name: Initialize package_entries accumulator (loop below may have zero iterations)
  ansible.builtin.set_fact:
    windows_common_package_entries: []

# A catalog entry has two possible shapes: a flat chocolatey: <name>
# string (package_catalog.yml's firefox/vscode/sevenzip/
# notepadplusplus) or a custom-installer entry nested under windows:
# (internal_agent/vendor_tool, Claude_Docs/Design_Software-Manifest.md §8/§9).
- name: Normalize into {name, spec} for this host's package manager
  ansible.builtin.set_fact:
    windows_common_package_entries: >-
      {{ (windows_common_package_entries | default([])) +
         [{
           'name': (item.name if item is mapping else item),
           'requires_gui': (
             (item.requires_gui | default(false))
             if item is mapping
             else (packages[item].requires_gui | default(false) if item in packages else false)
           ),
           'spec': (
             (item.windows | default({}))
             if item is mapping
             else (
               (packages[item].windows | default(packages[item].chocolatey | default({})))
               if item in packages
               else {}
             )
           )
         }]
      }}
  loop: "{{ windows_common_raw_packages | unique }}"
  loop_control:
    label: "{{ item.name if item is mapping else item }}"

# Claude_Docs/Design_Software-Manifest.md §2 — a missing platform field is a silent
# skip, not an error.
- name: Drop entries with nothing applicable on this platform
  ansible.builtin.set_fact:
    windows_common_package_entries: "{{ windows_common_package_entries | rejectattr('spec', 'equalto', {}) | list }}"

- name: Report skipped packages (visibility, not a failure)
  ansible.builtin.debug:
    msg: >-
      {{ (windows_common_raw_packages | unique | length) - (windows_common_package_entries | length) }}
      resolved package(s) have nothing applicable to Windows on this host — skipped (§2).
  when: (windows_common_raw_packages | unique | length) != (windows_common_package_entries | length)

# Server Core has no desktop, so a package marked requires_gui (Firefox)
# can't install there: it's skipped on Core hosts of every Windows Server
# version rather than dropped from the manifest (question 23).
- name: Read the Windows installation type (Server Core or not)
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion
    name: InstallationType
  register: windows_common_installation_type

- name: Report GUI-only packages skipped on Server Core
  ansible.builtin.debug:
    msg: >-
      Server Core has no desktop: skipping {{ windows_common_package_entries
      | selectattr('requires_gui') | map(attribute='name') | join(', ') }}.
  when:
    - windows_common_installation_type.value | default('') == 'Server Core'
    - windows_common_package_entries | selectattr('requires_gui') | list | length > 0

- name: Drop GUI-only packages on Server Core
  ansible.builtin.set_fact:
    windows_common_package_entries: "{{ windows_common_package_entries | rejectattr('requires_gui') | list }}"
  when: windows_common_installation_type.value | default('') == 'Server Core'

# --- §8: locally-sourced installers — copy before install ---

- name: Copy locally-sourced installer files to the target
  ansible.windows.win_copy:
    src: "{{ software_store_path }}/{{ item.spec.path }}"
    dest: "C:\\Windows\\Temp\\{{ item.spec.path | basename }}"
  loop: "{{ windows_common_package_entries | selectattr('spec.source', 'defined') | selectattr('spec.source', 'equalto', 'local') | list }}"
  loop_control:
    label: "{{ item.name }}"

# --- Install: chocolatey entries (a bare package-name spec, no `type`) ---

# .NET Framework 4.8 on every host that has an older 4.x (Windows Server
# 2019 ships 4.7.2; 2022/2025/10/11 already have 4.8 or newer). Chocolatey
# 2.x needs it ("Chocolatey 2.0.0 requires .NET Framework 4.8"), and it's
# the supported in-place update for anything still on 4.x. Release key
# 528040 = 4.8. Microsoft's offline installer; it asks for a reboot.
- name: Read the installed .NET Framework 4.x release
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Microsoft\NET Framework Setup\NDP\v4\Full
    name: Release
  register: windows_common_dotnet

- name: Install .NET Framework 4.8 where an older 4.x is present
  ansible.windows.win_package:
    path: https://go.microsoft.com/fwlink/?linkid=2088631   # ndp48-x86-x64-allos-enu.exe
    arguments: /q /norestart
    expected_return_code: [0, 3010]
  register: windows_common_dotnet48
  when: (windows_common_dotnet.value | default(0) | int) < 528040

- name: Reboot to finish the .NET Framework 4.8 install
  ansible.windows.win_reboot:
    reboot_timeout: 1800
  when: windows_common_dotnet48 is changed and windows_common_dotnet48.reboot_required | default(false)

- name: Install chocolatey entries
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item.spec if item.spec is string else item.spec.package }}"
    state: present
  loop: "{{ windows_common_package_entries | rejectattr('spec.type', 'defined') | list }}"
  loop_control:
    label: "{{ item.name }}"

# --- Install: custom .msi installers (URL or local — §8/§9) ---

- name: Install custom .msi installers (URL or local)
  ansible.windows.win_package:
    path: >-
      {{ item.spec.url if item.spec.source == 'url'
         else 'C:\\Windows\\Temp\\' + (item.spec.path | basename) }}
    # A local MSI's product code is read from the file (Catalog → Updates' newest, P1).
    product_id: "{{ item.spec.product_id | default(omit) }}"
    state: present
  loop: "{{ windows_common_package_entries | selectattr('spec.type', 'defined') | selectattr('spec.type', 'equalto', 'msi') | list }}"
  loop_control:
    label: "{{ item.name }}"

# --- Install: custom .exe installers (P1: the .NET runtime, hosting bundle and SDK) ---
# Their own silent arguments; installing what's there already is quick and harmless for these.
- name: Install custom .exe installers (URL or local)
  ansible.windows.win_package:
    path: >-
      {{ item.spec.url if item.spec.source == 'url'
         else 'C:\\Windows\\Temp\\' + (item.spec.path | basename) }}
    arguments: "{{ item.spec.args | default(omit) }}"
    product_id: "{{ item.spec.product_id | default(omit) }}"
    creates_path: "{{ item.spec.creates | default(omit) }}"
    expected_return_code: [0, 3010, 1638]
    state: present
  loop: "{{ windows_common_package_entries | selectattr('spec.type', 'defined') | selectattr('spec.type', 'equalto', 'exe') | list }}"
  loop_control:
    label: "{{ item.name }}"

# --- npm packages (P1: Claude Code), system-wide in Node.js' own folder, updated weekly ---
- name: The npm packages chosen
  ansible.builtin.set_fact:
    windows_common_npm: >-
      {{ windows_common_raw_packages | unique | select('string') | select('in', packages)
         | map('extract', packages) | selectattr('npm', 'defined') | map(attribute='npm') | list }}

- name: Node.js (LTS) for them
  chocolatey.chocolatey.win_chocolatey:
    name: nodejs-lts
    state: present
  when: windows_common_npm | length > 0

- name: Git for Windows (Claude Code needs its bash)
  chocolatey.chocolatey.win_chocolatey:
    name: git
    state: present
  when: "'@anthropic-ai/claude-code' in windows_common_npm"

# Through PowerShell: npm is a .cmd (win_command can't start one), and Node.js was installed in this
# same run, so the machine PATH is read again.
- name: Install them for every user (in C:\Program Files\nodejs, which is on the PATH)
  ansible.windows.win_shell: |
    $ErrorActionPreference = 'Stop'
    $env:Path = [Environment]::GetEnvironmentVariable('Path', 'Machine')
    & 'C:\Program Files\nodejs\npm.cmd' install -g --prefix 'C:\Program Files\nodejs' '{{ item }}'
    if ($LASTEXITCODE -ne 0) { throw "npm install {{ item }} failed ($LASTEXITCODE)" }
  loop: "{{ windows_common_npm }}"
  changed_when: true

# (Register-ScheduledTask: the image carries ansible.windows, not community.windows.)
- name: Keep them up to date (a weekly task)
  ansible.windows.win_powershell:
    script: |
      param([string]$Packages)
      $ErrorActionPreference = 'Stop'
      $action = New-ScheduledTaskAction -Execute 'C:\Program Files\nodejs\npm.cmd' `
        -Argument "update -g --prefix `"C:\Program Files\nodejs`" $Packages"
      $trigger = New-ScheduledTaskTrigger -Weekly -DaysOfWeek Sunday -At 4am
      $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -RunLevel Highest
      Register-ScheduledTask -TaskName 'LABaPe npm updates' -Action $action -Trigger $trigger -Principal $principal `
        -Description 'LABaPe (P1): updates the npm packages LABaPe installed' -Force | Out-Null
    parameters:
      Packages: "{{ windows_common_npm | join(' ') }}"
    error_action: stop
  when: windows_common_npm | length > 0

# --- Local accounts (Claude_Docs/Design_Directory-Objects.md §5/§4/§7) — this host's
# role only, via the for_host_group filter (ansible/filter_plugins/
# directory_objects.py); directory_manifest is loaded once at the play
# level (playbooks/site.yml), same pattern as software_manifest_roles.

# A domain controller has no local account database: win_group/win_user
# there create *domain* objects instead, which would quietly put
# "local" manifest entries into AD (and win_user then failed outright on
# the medium profile's dual-role DC). Skip local scope on DCs, visibly.
- name: Note that local-scope directory objects are skipped on a domain controller
  ansible.builtin.debug:
    msg: "{{ inventory_hostname }} is a domain controller; local_groups/local_users/local memberships targeting its other roles are skipped."
  when: "'domain_controller' in group_names"
  tags: [directory_objects]

- name: Ensure local groups exist
  ansible.windows.win_group:
    name: "{{ item.name }}"
    state: present
  loop: "{{ (directory_manifest.local_groups | default([])) | for_host_group(group_names) }}"
  loop_control:
    label: "{{ item.name }}"
  when: "'domain_controller' not in group_names"
  tags: [directory_objects, local_group]

- name: Ensure local users exist
  ansible.windows.win_user:
    name: "{{ item.name }}"
    # Each VM's own password for the account (A2), else the environment's.
    password: >-
      {{ (labape_host_passwords | default({})).get(item.name)
         or (lookup('vars', item.password_vault_key) if item.password_vault_key is defined else default_user_password) }}
    groups: "{{ item.groups | default(omit) }}"
    state: present
  loop: "{{ (directory_manifest.local_users | default([])) | for_host_group(group_names) }}"
  loop_control:
    label: "{{ item.name }}"
  no_log: true
  when: "'domain_controller' not in group_names"
  tags: [directory_objects, local_user]

# state: present is additive (existing members untouched) — state: pure
# would replace the whole membership list, which isn't what a manifest
# entry meant to add one more member should do.
- name: Apply local-scope group memberships (domain principal or local account into a local group)
  ansible.windows.win_group_membership:
    name: "{{ item.group }}"
    members: ["{{ item.member }}"]
    state: present
  loop: >-
    {{ (directory_manifest.memberships | default([]))
       | selectattr('group_scope', 'equalto', 'local')
       | list
       | for_host_group(group_names) }}
  loop_control:
    label: "{{ item.member }} -> {{ item.group }}"
  # A DOMAIN-qualified member (backslash) can't be resolved in an environment without a
  # domain controller (e.g. a --test environment of member servers), so
  # those entries are skipped there instead of failing the play.
  when:
    - "'domain_controller' not in group_names"
    - '(groups["domain_controller"] | default([]) | length > 0) or ("\\" not in item.member)'
  tags: [directory_objects, membership]

# A1: on member servers (a domain controller has no local accounts), a second local admin, only for
# recovery: LABaPe sets Administrator's password again with it when that one is lost, and the other way
# round. Its password is LABaPe's (labape_recovery_local_password); a deploy sets it again.
- name: Second local admin for recovery (labape-admin2)
  ansible.windows.win_user:
    name: "{{ labape_recovery_admin | default('labape-admin2') }}"
    password: "{{ labape_recovery_local_password }}"
    update_password: always
    password_never_expires: true
    description: LABaPe recovery account (resets Administrator; see the Secrets page)
    groups: [Administrators]
    groups_action: add
    state: present
  no_log: true
  when:
    - labape_recovery_local_password | default('') | length > 0
    - "'domain_controller' not in group_names"

