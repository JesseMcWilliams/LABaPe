---
# Google's Linux repository (P1: Chrome), added once per host when a chosen package needs it.

- name: Google's repo (dnf/RHEL family)
  ansible.builtin.yum_repository:
    name: google-chrome
    description: Google Chrome
    baseurl: https://dl.google.com/linux/chrome/rpm/stable/x86_64
    gpgcheck: true
    gpgkey: https://dl.google.com/linux/linux_signing_key.pub
  when: ansible_facts['pkg_mgr'] == 'dnf'

- name: Google's signing key (apt/Debian family)
  ansible.builtin.get_url:
    url: https://dl.google.com/linux/linux_signing_key.pub
    dest: /etc/apt/keyrings/google.asc
    mode: "0644"
  when: ansible_facts['pkg_mgr'] == 'apt'

- name: Google's repo (apt/Debian family)
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/google.asc] https://dl.google.com/linux/chrome/deb/ stable main"
    state: present
    filename: google-chrome
  when: ansible_facts['pkg_mgr'] == 'apt'
