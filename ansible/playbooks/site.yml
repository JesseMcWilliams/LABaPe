---
# Claude_Docs/Design_System-Overview.md §4's ordered pipeline. M1 only has linux_server hosts, so
# the domain_controller/domain_directory plays below simply match zero
# hosts and no-op — kept here now rather than bolted on later, since
# the ordering constraint (Claude_Docs/Design_System-Overview.md §8) is easy to get wrong if it's
# retrofitted after the fact.

- name: Wait for freshly-created hosts to actually accept connections
  # virt-install's --wait returns once the post-install reboot lands the
  # domain back in "running" state, but that's not the same moment
  # sshd/WinRM is actually up inside the guest — for the *last* host in
  # a multi-host apply (serialized, Claude_Docs/Design_System-Overview.md/deploy.sh -parallelism=1)
  # there's effectively zero buffer between "just rebooted" and
  # ansible-playbook's very next task trying to connect. Hit as a real
  # UNREACHABLE failure in the M1 smoke test, not a hypothetical.
  # 30 minutes, not 5: a cloned VM's create step returns as soon as it
  # boots, and Windows then runs specialize/OOBE/first logon (plus
  # driver setup for a "new" NIC); Desktop Experience installs and busy
  # hosts took well over 5 minutes in M6 testing. Hosts that are already
  # up answer immediately, so the longer cap costs nothing.
  hosts: all
  gather_facts: false
  tasks:
    # Member servers: their own Administrator password (A2), which also waits for the connection.
    - name: Each member server's own Administrator password (A2)
      ansible.builtin.include_tasks: tasks/labape_admin_password.yml
      when: ansible_connection | default('ssh') == 'winrm'

    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 1800
      when: ansible_connection | default('ssh') != 'winrm'

- name: Linux hosts resolve their own name
  # Template clones keep the build VM's "127.0.1.1 template" line, so the
  # clone's own name doesn't resolve (sudo warns, hostname -f fails). Fixed
  # here rather than in the clone seed: a seed change would reinstall every
  # existing Linux VM on its next deploy. Only an existing 127.0.1.1 line is
  # rewritten (the Debian family has one; the RHEL family doesn't).
  hosts: linux_server:linux_workstation
  gather_facts: false
  become: true
  vars:
    labape_fqdn: "{{ inventory_hostname }}{{ ('.' ~ domain_name) if (domain_name | default('')) else '' }}"
  tasks:
    - name: Point 127.0.1.1 at this host's name
      ansible.builtin.replace:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s.*$'
        replace: "127.0.1.1\t{{ labape_fqdn }} {{ inventory_hostname }}"

- name: Promote domain controller(s) first — must complete before any join
  # No become: this play runs over WinRM as the local Administrator
  # (Claude_Docs/Reference_Credentials.md §4), which already has full privileges — unlike
  # SSH, Windows become needs ansible_become_user/ansible_become_pass
  # configured, which nothing here sets. Matches windows_common's play.
  hosts: domain_controller
  gather_facts: true
  roles:
    - domain_controller
  tags: [domain_controller]

- name: Populate the domain — OUs, domain groups/users, domain-scope membership
  # No become: same reasoning as the domain_controller play above (M4) —
  # this play runs over WinRM as the local Administrator, already fully
  # privileged; Windows become needs ansible_become_user/pass, which
  # nothing sets. Confirmed as a real bug hands-on: a live M4 test run
  # hit this exact error the moment a real domain existed to promote
  # this (till-then-placeholder) play into actually running:
  # "Become plugin sudo is not supported by the Windows exec wrapper."
  hosts: domain_controller
  gather_facts: true
  vars:
    # errors='ignore' + the default(): directory-manifest.yml is
    # entirely optional (M5, Claude_Docs/Design_Directory-Objects.md) — an
    # environment with no domain objects to add just shouldn't need to
    # create an empty file.
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - domain_directory
  tags: [directory_objects]

# --- Domain join (Windows/Linux) — after the domain (and its DNS)
# exists, before per-role software config below. Both roles no-op via
# the role-entry `when:` guard on any M1-M3-style environment with no
# domain_controller-role host (Claude_Docs/Design_System-Overview.md §8/§18, M4).

- name: Join Linux hosts to the domain
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  roles:
    - role: linux_domain_join
      when: groups['domain_controller'] | length > 0
  tags: [domain_join]

- name: Join Windows hosts to the domain
  # No become — see the domain_controller play's note above. Excludes a
  # dual-role DC+member-server host: DCs have their own membership
  # semantics, not touched via this generic join role.
  hosts: windows_server:windows_workstation
  gather_facts: true
  roles:
    - role: windows_domain_join
      when: groups['domain_controller'] | length > 0 and 'domain_controller' not in group_names
  tags: [domain_join]

# --- Per-role configuration (software + local accounts) ---
# Claude_Docs/Design_Software-Manifest.md §5 — software_manifest_roles is computed
# once here (lookup runs on the control machine) rather than per-host,
# since the file it reads lives in the repo, not on any target.

- name: Configure Linux hosts (software manifest, local accounts)
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  vars_files:
    - ../package_catalog.yml
  vars:
    software_manifest_roles: "{{ (lookup('file', playbook_dir + '/../software-manifest.yml') | from_yaml).roles | default({}) }}"
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - linux_common
    # Services chosen in the web UI (no-op when none were chosen).
    - labape_services
  tags: [software, directory_objects]

- name: Configure Windows hosts (software manifest, local accounts)
  hosts: windows_server:windows_workstation
  gather_facts: true
  vars_files:
    - ../package_catalog.yml
  vars:
    software_manifest_roles: "{{ (lookup('file', playbook_dir + '/../software-manifest.yml') | from_yaml).roles | default({}) }}"
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - windows_common
    # Services chosen in the web UI (no-op when none were chosen).
    - labape_services
  tags: [software, directory_objects]

- name: Remote Desktop on Windows hosts (Claude_Docs/Planning_Web-Interface-Design.md §28.5)
  # Every Windows host, domain controllers included (they don't get windows_common).
  # No become: WinRM as the local Administrator, as above.
  hosts: windows_server:windows_workstation:domain_controller
  gather_facts: false
  roles:
    - windows_rdp
  tags: [remote_access]

- name: Desktop sessions on Linux hosts (Claude_Docs/Planning_Web-Interface-Design.md §50.5)
  # Only where the host group asked for xrdp or VNC (labape_remote_desktop, set by LABaPe); after
  # the local accounts exist (VNC displays are theirs).
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  roles:
    - role: linux_remote_desktop
      when: (labape_remote_desktop | default([])) | length > 0
  tags: [remote_access]

# --- Platform certificates (Claude_Docs/Planning_Web-Interface-Design.md §22.5) ---
# Web-interface deploys only: every host trusts the platform root and gets
# a certificate signed by the platform CA, renewed on the host. No-op from
# the CLI (no LABAPE_CERT_TOKEN in the environment).

- name: Platform certificates (Linux)
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  roles:
    - labape_cert
  tags: [certificates]

- name: Platform certificates (Windows)
  hosts: windows_server:windows_workstation:domain_controller
  gather_facts: true
  roles:
    - labape_cert
  tags: [certificates]

# --- Service roles (Claude_Docs/Planning_Web-Interface-Design.md §27) ---
# A service chosen in the web UI may name an Ansible role (`linux.role`) for
# configuration that packages and units can't express, e.g. the syslog
# collector's listeners. Runs after the platform certificates so the role can
# use them. Only roles on this list run; it matches the catalog's allow-list
# (app/labape/catalog.py SERVICE_ROLES). No-op from the CLI (no services).

- name: Roles for the selected services (Linux)
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  vars:
    labape_service_roles_allowed: [syslog_collector]
    labape_service_roles: >-
      {{ (labape_services | default({})).values() | selectattr('linux', 'defined')
         | map(attribute='linux') | selectattr('role', 'defined') | map(attribute='role')
         | select('in', labape_service_roles_allowed) | unique | list }}
  tasks:
    - name: Run each service's role
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop: "{{ labape_service_roles }}"
  tags: [software]
