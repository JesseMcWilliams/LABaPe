---
# DESIGN.md §4's ordered pipeline. M1 only has linux_server hosts, so
# the domain_controller/domain_directory plays below simply match zero
# hosts and no-op — kept here now rather than bolted on later, since
# the ordering constraint (DESIGN.md §8) is easy to get wrong if it's
# retrofitted after the fact.

- name: Wait for freshly-created hosts to actually accept connections
  # virt-install's --wait returns once the post-install reboot lands the
  # domain back in "running" state, but that's not the same moment
  # sshd/WinRM is actually up inside the guest — for the *last* host in
  # a multi-host apply (serialized, DESIGN.md/deploy.sh -parallelism=1)
  # there's effectively zero buffer between "just rebooted" and
  # ansible-playbook's very next task trying to connect. Hit as a real
  # UNREACHABLE failure in the M1 smoke test, not a hypothetical.
  hosts: all
  gather_facts: false
  tasks:
    - name: Wait for connection
      ansible.builtin.wait_for_connection:
        timeout: 300

- name: Promote domain controller(s) first — must complete before any join
  # No become: this play runs over WinRM as the local Administrator
  # (docs/credentials.md §4), which already has full privileges — unlike
  # SSH, Windows become needs ansible_become_user/ansible_become_pass
  # configured, which nothing here sets. Matches windows_common's play.
  hosts: domain_controller
  gather_facts: true
  roles:
    - domain_controller
  tags: [domain_controller]

- name: Populate the domain — OUs, domain groups/users, domain-scope membership
  # No become: same reasoning as the domain_controller play above (M4) —
  # this play runs over WinRM as the local Administrator, already fully
  # privileged; Windows become needs ansible_become_user/pass, which
  # nothing sets. Confirmed as a real bug hands-on: a live M4 test run
  # hit this exact error the moment a real domain existed to promote
  # this (till-then-placeholder) play into actually running:
  # "Become plugin sudo is not supported by the Windows exec wrapper."
  hosts: domain_controller
  gather_facts: true
  vars:
    # errors='ignore' + the default(): directory-manifest.yml is
    # entirely optional (M5, docs/directory-objects.md) — an
    # environment with no domain objects to add just shouldn't need to
    # create an empty file.
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - domain_directory
  tags: [directory_objects]

# --- Domain join (Windows/Linux) — after the domain (and its DNS)
# exists, before per-role software config below. Both roles no-op via
# the role-entry `when:` guard on any M1-M3-style environment with no
# domain_controller-role host (DESIGN.md §8/§18, M4).

- name: Join Linux hosts to the domain
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  roles:
    - role: linux_domain_join
      when: groups['domain_controller'] | length > 0
  tags: [domain_join]

- name: Join Windows hosts to the domain
  # No become — see the domain_controller play's note above. Excludes a
  # dual-role DC+member-server host: DCs have their own membership
  # semantics, not touched via this generic join role.
  hosts: windows_server:windows_workstation
  gather_facts: true
  roles:
    - role: windows_domain_join
      when: groups['domain_controller'] | length > 0 and 'domain_controller' not in group_names
  tags: [domain_join]

# --- Per-role configuration (software + local accounts) ---
# docs/software-manifest.md §5 — software_manifest_roles is computed
# once here (lookup runs on the control machine) rather than per-host,
# since the file it reads lives in the repo, not on any target.

- name: Configure Linux hosts (software manifest, local accounts)
  hosts: linux_server:linux_workstation
  become: true
  gather_facts: true
  vars_files:
    - ../package_catalog.yml
  vars:
    software_manifest_roles: "{{ (lookup('file', playbook_dir + '/../software-manifest.yml') | from_yaml).roles | default({}) }}"
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - linux_common
  tags: [software, directory_objects]

- name: Configure Windows hosts (software manifest, local accounts)
  hosts: windows_server:windows_workstation
  gather_facts: true
  vars_files:
    - ../package_catalog.yml
  vars:
    software_manifest_roles: "{{ (lookup('file', playbook_dir + '/../software-manifest.yml') | from_yaml).roles | default({}) }}"
    directory_manifest: >-
      {{
        (lookup('file', playbook_dir + '/../directory-manifest.yml', errors='ignore') | from_yaml)
        | default({}, true)
      }}
  roles:
    - windows_common
  tags: [software, directory_objects]
