---
# A2 (Planning_Lists-Secrets-Settings.md): each member server's Administrator has a password of its
# own. A new VM starts with the environment's bootstrap one; LABaPe puts this VM's own in
# labape_admin_password (its host variables; equal to ansible_password once it has it). Included by
# site.yml's first play, before anything else signs in, for Windows hosts that aren't domain controllers.
#
# WinRM here is Basic authentication, which sends the password with every request: the change's own
# reply is refused, so signing in with the new password decides, and a marker (labape-applied/<host> in
# the workspace) tells LABaPe the VM has it. Everything is decided once, up front: a `when` on a block is checked
# again before each of its tasks, after ansible_password has already changed.

- name: Whether this VM is getting its own Administrator password (A2)
  ansible.builtin.set_fact:
    labape_admin_change: >-
      {{ (labape_admin_password | default('')) | length > 0
         and labape_admin_password != ansible_password
         and 'domain_controller' not in group_names }}
  no_log: true

# A run that stopped after the change but before LABaPe recorded it leaves the VM with the new password:
# the stored one is then refused, and the new one is the one to use.
- name: An earlier run already gave it the new password?
  ansible.windows.win_ping:
  register: labape_admin_probe
  ignore_unreachable: true
  when: labape_admin_change | bool

- name: Then sign in with the new one, and record it
  ansible.builtin.set_fact:
    ansible_password: "{{ labape_admin_password }}"
    labape_admin_change: false
    labape_admin_took: true
  no_log: true
  when:
    - labape_admin_change | bool
    - labape_admin_probe.unreachable | default(false)
    - "'rejected' in (labape_admin_probe.msg | default(''))"

- name: Wait for connection
  ansible.builtin.wait_for_connection:
    timeout: 1800

# In the same WinRM shell, not detached (async): a detached process lost its access to the account
# database once the shell that started it closed, and every change failed (0x80005000;
# Testing_Troubleshooting-Log.md). The VM takes the new password at once; the task's reply is refused
# with the old one, which is expected. The password is a module parameter, never on a command line.
- name: Set this VM's own Administrator password (this connection signs in as Administrator)
  ansible.windows.win_powershell:
    script: |
      param([string]$Password)
      $ErrorActionPreference = 'Stop'
      $user = [ADSI]('WinNT://{0}/Administrator,user' -f [Environment]::MachineName)
      $user.SetPassword($Password)
    parameters:
      Password: "{{ labape_admin_password }}"
    error_action: stop
  register: labape_admin_change_result
  ignore_errors: true
  ignore_unreachable: true
  no_log: true
  when: labape_admin_change | bool

- name: Go on signing in with it
  ansible.builtin.set_fact:
    labape_admin_old: "{{ ansible_password }}"
    ansible_password: "{{ labape_admin_password }}"
  no_log: true
  when: labape_admin_change | bool

- name: Wait until it signs in with its own password
  ansible.builtin.wait_for_connection:
    delay: 3
    timeout: 120
  register: labape_admin_wait
  ignore_errors: true
  when: labape_admin_change | bool

- name: It took the new password
  ansible.builtin.set_fact:
    labape_admin_took: true
  when:
    - labape_admin_change | bool
    - labape_admin_wait is succeeded

# It didn't: sign in with the old one again, and fail with what the change said.
- name: Sign in with the old password again
  ansible.builtin.set_fact:
    ansible_password: "{{ labape_admin_old }}"
  no_log: true
  when:
    - labape_admin_change | bool
    - labape_admin_wait is failed

- name: Stop here; the VM keeps its old Administrator password
  ansible.builtin.fail:
    msg: >-
      Administrator's own password didn't take on {{ inventory_hostname }}:
      {{ (labape_admin_change_result.error | default([]) | map(attribute='exception') | map(attribute='message') | join('; '))
         or labape_admin_change_result.msg | default('no error recorded') }}
  when:
    - labape_admin_change | bool
    - labape_admin_wait is failed

- name: Tell LABaPe this VM has its own Administrator password now
  ansible.builtin.copy:
    content: ""
    dest: "{{ playbook_dir }}/../../labape-applied/{{ inventory_hostname }}"
    mode: "0600"
  delegate_to: localhost
  when: labape_admin_took | default(false) | bool
