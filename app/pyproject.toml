[project]
name = "labape"
version = "0.4.0"
description = "LABaPe web application: UI, REST API and job runner for lab environments"
requires-python = ">=3.11"
license = "AGPL-3.0-only"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "authlib>=1.3",
  "httpx>=0.27",
  "itsdangerous>=2.2",
  "pydantic-settings>=2.4",
  "cryptography>=43",
  "pyyaml>=6.0",
  "python-multipart>=0.0.9",
  "alembic>=1.13",
]

[project.scripts]
labape = "labape.cli:main"

# Authentication providers are plugins (Claude_Docs/Planning_Web-Interface-Design.md
# §12): a provider is a class registered under this entry-point group.
[project.entry-points."labape.auth_providers"]
oidc = "labape.auth.oidc:OidcProvider"
breakglass = "labape.auth.breakglass:BreakglassProvider"

# Secret stores are plugins too (Claude_Docs/Reference_Secrets-Backend-Requirements.md §3).
[project.entry-points."labape.secrets_providers"]
builtin = "labape.stores.builtin:BuiltinStore"
openbao = "labape.stores.openbao:OpenBaoStore"
conjur = "labape.stores.conjur:ConjurStore"

[build-system]
requires = ["setuptools>=77"]      # 77: the SPDX `license` expression (PEP 639)
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["labape*"]

# Alembic's environment, template and revisions ship with the package.
[tool.setuptools.package-data]
labape = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
