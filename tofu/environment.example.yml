# Copy to environment.yml and fill in — see Claude_Docs/Design_System-Overview.md §10.
# .gitignore excludes the real file; this example is the only version
# checked in.

domain_name: company.com      # placeholder — not yet consumed by anything in M1
                               # (no domain_controller role until M4); kept here
                               # so the file's shape matches later milestones.
netbios_name: COMPANY

# M1 only implements the iso_direct image source (Claude_Docs/Design_System-Overview.md §18) —
# iso_direct installs from ISO every time; packer_template clones a
# template from the library (a host group then also sets `template`).
# Both stay supported side by side, per host group
# (Claude_Docs/Design_Base-Images.md).
image_source_default: iso_direct

network_mode: bridged          # only mode implemented — nat lands in M7
management_source: 192.168.1.50   # your control machine's IP/CIDR — SSH firewall
                                   # scoping, Claude_Docs/Reference_Credentials.md §7

# Network catalog (Claude_Docs/Planning_Web-Interface-Design.md §20): the
# networks VMs may use and the rules for each. A host group picks one
# with `network:` (default: default_network) and `addressing: static|dhcp`.
# scripts/lib/check_ip_policy.py refuses a plan that breaks these rules
# before anything is created. See Claude_Docs/Reference_Networking.md §1's
# Caution before using an address range that's in use elsewhere.
default_network: lab
networks:
  lab:
    cidr: 192.168.1.0/24
    gateway: 192.168.1.1         # optional; default the network's .1
    dns_servers: [192.168.1.1]   # optional; default [gateway]. A domain
                                 # controller still becomes its members' DNS.
    bridge: br0                  # host bridge; optional, default the profile's bridge_device
    addressing: [static, dhcp]   # allowed modes; default [static]
    # Static addresses come from the profile's static_ip_offset_start (or
    # static_ip_offsets.<network>) and must land in a static pool. Keep the
    # pools outside the DHCP server's scope.
    static_pools: ["192.168.1.100-192.168.1.199"]
    dhcp_ranges: ["192.168.1.200-192.168.1.250"]   # the DHCP server's scope
    reserved: ["192.168.1.2-192.168.1.20"]         # infrastructure; never assigned

# Older single-network form, still accepted (read as one network named
# "default", static only, bridge = the profile's bridge_device):
# network:
#   mode: bridged
#   network_address: 192.168.1.0
#   subnet_mask: 255.255.255.0
#   gateway: 192.168.1.1
#   management_source: 192.168.1.50

software_store_path: ./software-store   # not yet used in M1 — no locally-sourced
                                         # installers exercised until the software
                                         # manifest lands (M6, Claude_Docs/Design_Software-Manifest.md)

# Directory on the libvirt host where VM disks (and, for Windows, the
# generated answer-file ISO) get created. Convention on this project's
# real test host is a dedicated /data volume rather than the small root
# filesystem — adjust to whatever's right for yours.
vm_storage_path: /data/VMs/LABaPe

# Template library (image_source: packer_template). Optional; defaults to
# <vm_storage_path>/templates. scripts/promote-to-template.sh registers it
# as the libvirt storage pool "labape-templates" on first use.
# template_storage_path: /data/VMs/LABaPe/templates

# Per-OS ISO path already staged on the libvirt host's filesystem —
# tofu/modules/vm/libvirt's iso_direct path shells out to virt-install
# on that host, which needs a local path, not a URL (Claude_Docs/Design_Base-Images.md).
os_iso_paths:
  rocky9: /data/OS_Images/Rocky-9-x86_64-minimal.iso
  # Windows and Debian-family entries are all optional — only needed if
  # a host_group actually uses that os key.
  windows_server_2019: /data/OS_Images/Windows_Server_2019.iso
  windows_server_2022: /data/OS_Images/SERVER_2022_x64FRE_en-us.iso
  windows_server_2025: /data/OS_Images/SERVER_2025_x64FRE_en-us.iso
  windows_11: /data/OS_Images/Windows_11_24H2.iso
  # The live-server ISO specifically — subiquity/autoinstall (M5) lives
  # there, not on the desktop image.
  ubuntu_lts: /data/OS_Images/ubuntu-24.04-live-server-amd64.iso
  ubuntu_26: /data/OS_Images/ubuntu-26.04-live-server-amd64.iso
  # debian-installer/preseed (real Debian, not Ubuntu) — a netinst ISO,
  # not the multi-GB full DVD image (only netinst uses the classic
  # installer download flow this template targets).
  debian_latest: /data/OS_Images/debian-13-netinst-amd64.iso
  windows_10: /data/OS_Images/Windows_10.iso
